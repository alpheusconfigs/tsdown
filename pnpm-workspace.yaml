packages:
    - ./package
    - ./tests/*
    - ./examples/*

autoInstallPeers: false
strictPeerDependencies: false

allowBuilds:
    esbuild: false

catalogs:
    dev:
        "@types/node": ^25
        "tsdown": 0.23.0
    peer:
        "tsdown": ^0.23.0
    test:
        "vite": ^8.3.7
        "vitest": ^5.1.0

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    - "@apst/*"
    - "@rolldown/*"
    - "rolldown"
    - "rolldown-plugin-dts"
    - "@tsdown/*"
    - "tsdown"
